name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        timeout-minutes: 15 # a hang (e.g. a screen that keeps redrawing) should fail, not run for hours
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Published as a release rather than a workflow artifact: releases don't count towards the
      # Actions storage quota, and the phone gets a plain .apk (no zip) at a link that never changes:
      # https://github.com/<owner>/<repo>/releases/download/latest/language-keyboard.apk
      - name: Publish to the "latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk language-keyboard.apk
          cp lens/build/outputs/apk/debug/lens-debug.apk language-lens.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest language-keyboard.apk language-lens.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
