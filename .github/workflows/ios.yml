name: Build iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write # to publish the "ios-latest" release

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test keyboard logic
        timeout-minutes: 15
        run: swift test --package-path ios/Core

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for the simulator
        run: |
          cd ios
          xcodebuild -project LanguageKeyboard.xcodeproj -scheme LanguageKeyboard \
            -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee sim.log | grep -E "error:|warning: .*Swift|BUILD" || true
          grep -q "BUILD SUCCEEDED" sim.log

      # Unsigned: installing it on a phone needs re-signing (an Apple account) – see the README.
      - name: Build unsigned .ipa
        run: |
          cd ios
          xcodebuild -project LanguageKeyboard.xcodeproj -scheme LanguageKeyboard \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -5
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LanguageKeyboard.app Payload/
          zip -qr ../language-keyboard-unsigned.ipa Payload

      - name: Publish to the "ios-latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest language-keyboard-unsigned.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest iOS build (unsigned)" \
            --notes "Built from ${GITHUB_SHA::7}. Unsigned: needs re-signing with an Apple account before it installs."
